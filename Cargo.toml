[package]
name = "verse-fmt"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
description = "A conservative formatter for Epic Games' Verse language."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eiei114/verse-fmt"
homepage = "https://github.com/eiei114/verse-fmt"
readme = "README.md"
keywords = ["verse", "uefn", "formatter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25.10"
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
globset = "0.4"
ignore = "0.4"
similar = "2.7"
pathdiff = "0.2"
same-file = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Console"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
